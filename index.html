<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tock Chat</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <div class="app-container">
    
    <!-- AUTH CONTAINER (Login Screen) -->
    <div id="auth-container" class="neumorphic-card">
      <!-- Auth Header with Theme Toggle -->
      <div class="top-header">
        <h1 class="brand-logo">Tock</h1>
        <button class="icon-btn" onclick="toggleTheme()" title="Toggle Theme">☀️</button>
      </div>
      <h3 class="auth-header-text">Tock-এ লগইন করুন</h3>
      
      <!-- Phone Step -->
      <div id="phone-step" class="input-group">
        <input type="text" id="auth-username" class="neumorphic-input" placeholder="আপনার নাম">
        <input type="tel" id="auth-phone" class="neumorphic-input" placeholder="+88017XXXXXXXX">
        <div id="recaptcha-container"></div>
        <button onclick="sendOTP()" class="neumorphic-btn action-btn">OTP কোড পাঠান</button>
      </div>

      <!-- OTP Step -->
      <div id="otp-step" class="input-group" style="display: none;">
        <input type="number" id="auth-otp" class="neumorphic-input" placeholder="৬ ডিজিটের OTP দিন">
        <button onclick="verifyOTP()" class="neumorphic-btn action-btn">লগইন করুন</button>
      </div>
    </div>

    <!-- MAIN CHAT CONTAINER -->
    <div id="chat-container" class="neumorphic-card" style="display: none;">
      
      <!-- Top Brand Header -->
      <div class="top-header">
        <h1 class="brand-logo">Tock</h1>
        <div class="header-actions">
          <button class="icon-btn" title="Notifications">🔔</button>
          <button id="theme-toggle" class="icon-btn" onclick="toggleTheme()" title="Toggle Theme">☀️</button>
          <button class="icon-btn" onclick="toggleMenu()" title="Menu">☰</button>
        </div>
      </div>

      <!-- Menu Popup -->
      <div id="main-menu" class="menu-popup" style="display: none;">
        <div class="menu-item" onclick="openProfileEdit()">👤 Profile Details (Bio/Address/Notes)</div>
        <div class="menu-item" onclick="viewInvites()">📩 Chat Invites</div>
        <div class="menu-item" onclick="logOut()">🚪 Logout</div>
        <div class="menu-item danger" onclick="deleteAccount()">🗑️ Delete Account</div>
      </div>

      <!-- Active Chat Header -->
      <div id="chat-sub-header" class="chat-header" style="display: none;">
        <div class="header-profile-info">
          <button id="back-btn" class="icon-btn back-btn" onclick="closeChat()">⬅</button>
          <div class="avatar-wrapper">
            <div id="partner-initial" class="avatar-initial">?</div>
            <span id="active-status-dot" class="status-dot"></span>
          </div>
          <div>
            <h3 id="current-chat-title">User Name</h3>
            <span id="typing-indicator" class="typing-text"></span>
          </div>
        </div>
        <button class="icon-btn" onclick="showPartnerDetails()" title="Chat Info">ℹ️</button>
      </div>

      <!-- Pinned Message Banner -->
      <div id="pinned-banner" class="pinned-banner" style="display: none;">
        <span>📌 <span id="pinned-text"></span></span>
        <button onclick="unpinMessage()" class="close-pin-btn">✖</button>
      </div>

      <!-- Navigation Tabs -->
      <div id="navigation-tabs" class="tab-menu">
        <button id="btn-tab-chats" class="tab-btn active" onclick="switchTab('chats')">চ্যাটস</button>
        <button id="btn-tab-contacts" class="tab-btn" onclick="switchTab('contacts')">কনট্যাক্টস</button>
      </div>

      <!-- Search Bar -->
      <div id="search-wrapper" class="search-box-wrapper">
        <input type="text" id="search-input" class="neumorphic-input" placeholder="নাম দিয়ে খুঁজুন..." oninput="handleSearch()">
        <button class="neumorphic-btn 3d-search-btn">🔍</button>
      </div>

      <!-- Tab 1: Recent Chats -->
      <div id="tab-chats" class="tab-content active">
        <div id="recent-chats-list" class="list-container"></div>
      </div>

      <!-- Tab 2: Contacts -->
      <div id="tab-contacts" class="tab-content" style="display: none;">
        <div id="contacts-list" class="list-container"></div>
      </div>

      <!-- Active Chat Box Section -->
      <div id="active-chat-section" style="display: none; width: 100%;">
        <div id="chat-box" class="chat-box"></div>
        <div class="input-box">
          <input type="text" id="message" class="neumorphic-input" placeholder="মেসেজ লিখুন..." oninput="handleTyping()">
          <button onclick="sendMessage()" class="neumorphic-btn send-btn">Send</button>
        </div>
      </div>

    </div>

  </div>

  <!-- Partner Info Modal -->
  <div id="partner-modal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <h3>Chat Partner Details</h3>
      <p><b>Name:</b> <span id="modal-name"></span></p>
      <p><b>Phone:</b> <span id="modal-phone"></span></p>
      <p><b>Bio:</b> <span id="modal-bio">Available</span></p>
      <p><b>Address:</b> <span id="modal-address">N/A</span></p>
      <hr>
      <button class="action-btn danger" onclick="blockUser()">Block Partner</button>
      <button class="action-btn" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="app.js"></script>
</body>
</html>
