<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tock - Neumorphic Chat</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="dark-theme">

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="auth-container">
    <div class="neumorphic-card auth-card">
      <div class="auth-header">
        <h1 class="logo">Tock</h1>
        <button class="neu-circle-btn theme-btn-trigger" title="Toggle Theme">
          <span class="theme-icon">☀️</span>
        </button>
      </div>
      <p class="subtitle">Enter Bangladeshi mobile number to receive OTP</p>
      
      <div id="phone-step" class="input-group">
        <input type="text" id="auth-name" placeholder="Your Full Name" class="neu-input">
        <input type="tel" id="auth-phone" placeholder="017XXXXXXXX or +88017XXXXXXXX" class="neu-input">
        <div id="recaptcha-container"></div>
        <button id="send-otp-btn" class="neu-btn primary">Send OTP</button>
      </div>

      <div id="otp-step" class="input-group hidden">
        <input type="text" id="auth-otp" placeholder="Enter 6-digit OTP" class="neu-input">
        <button id="verify-otp-btn" class="neu-btn primary">Verify & Login</button>
      </div>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="app-container" class="app-container hidden">
    <!-- Header -->
    <header class="top-header">
      <h1 class="logo">Tock</h1>
      <div class="header-right">
        <button class="neu-circle-btn rel notif-btn-trigger" title="Notifications">
          🔔
          <span class="badge notif-badge-elem"></span>
        </button>
        <button class="neu-circle-btn theme-btn-trigger" title="Toggle Theme">
          <span class="theme-icon">☀️</span>
        </button>
        <button class="neu-circle-btn" id="main-menu-btn" title="Menu">☰</button>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="tabs-container">
      <button class="tab-btn active" id="tab-chats">Chats</button>
      <button class="tab-btn" id="tab-contacts">Contacts</button>
    </div>

    <!-- Search Bar with New Neumorphic Search Icon Button -->
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search number or name...">
      <button class="neu-square-btn" id="search-btn" title="Search">
        <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="22" y2="22"></line>
        </svg>
      </button>
    </div>

    <!-- Dynamic List Panel -->
    <div id="list-panel" class="list-panel"></div>

    <!-- Active Chat Window -->
    <div id="chat-screen" class="chat-screen hidden">
      <div class="chat-header">
        <button class="neu-circle-btn" id="chat-back-btn">⬅</button>
        <div class="partner-info-btn" id="partner-header-info">
          <div class="avatar-small" id="chat-partner-avatar">U</div>
          <div>
            <div class="partner-name" id="chat-partner-name">User</div>
            <div class="partner-status" id="chat-partner-status">Offline</div>
          </div>
        </div>
        <div class="header-right">
          <button class="neu-circle-btn rel notif-btn-trigger" title="Notifications">
            🔔
            <span class="badge notif-badge-elem"></span>
          </button>
          <button class="neu-circle-btn theme-btn-trigger" title="Toggle Theme">
            <span class="theme-icon">☀️</span>
          </button>
          <button class="neu-circle-btn" id="chat-info-btn" title="Info">ℹ️</button>
        </div>
      </div>

      <div id="pinned-banner" class="pinned-banner hidden">
        <span>📌 Pinned: <span id="pinned-msg-text">...</span></span>
      </div>

      <div id="messages-container" class="messages-container"></div>

      <!-- Floating Action Bar with Custom Neumorphic Icons -->
      <div id="floating-action-bar" class="floating-action-bar hidden">
        <!-- Edit Icon -->
        <button id="act-edit" class="neu-circle-btn sm" title="Edit">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
        </button>
        <!-- Reply Icon -->
        <button id="act-reply" class="neu-circle-btn sm" title="Reply">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 14 4 9 9 4"></polyline>
            <path d="M20 20v-7a4 4 0 0 0-4-4H4"></path>
          </svg>
        </button>
        <!-- 3-Dot More Icon -->
        <button id="act-more" class="neu-circle-btn sm" title="More">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="5" r="2"></circle>
            <circle cx="12" cy="12" r="2"></circle>
            <circle cx="12" cy="19" r="2"></circle>
          </svg>
        </button>
      </div>

      <div class="input-container">
        <div id="reply-preview-box" class="reply-preview-box hidden">
          <span id="reply-preview-text">Replying...</span>
          <button id="cancel-reply-btn" class="close-sm">✖</button>
        </div>
        <div class="input-wrapper">
          <textarea id="message-input" placeholder="Type a message... (Press Enter to Send)" rows="1"></textarea>
          <button id="send-btn" class="send-btn">Send</button>
        </div>
      </div>
    </div>

    <!-- Partner Info Modal -->
    <div id="info-modal" class="modal-overlay hidden">
      <div class="modal-card neumorphic-card">
        <div class="avatar-large" id="info-avatar" style="margin: 0 auto;">U</div>
        <h3 id="info-name" style="text-align: center;">User Name</h3>
        <p id="info-phone" style="text-align: center; color: var(--accent-blue); font-size: 13px;">+8801XXXXXXX</p>
        <hr class="divider">
        <div class="menu-item" id="info-search-msg">
          <svg class="svg-icon sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          Search in chat
        </div>
        <div class="menu-item" id="info-mute-chat">🔕 Mute chat</div>
        <div class="menu-item danger-text" id="info-clear-msg">
          <!-- Delete Account/Clear Icon -->
          <svg class="svg-icon sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="14" y2="15"></line>
            <line x1="14" y1="11" x2="10" y2="15"></line>
          </svg>
          Clear all messages
        </div>
        <div class="menu-item danger-text" id="info-close-modal">Close</div>
      </div>
    </div>

    <!-- Profile Modal -->
    <div id="edit-profile-modal" class="modal-overlay hidden">
      <div class="modal-card neumorphic-card">
        <h3>My Profile</h3>
        <div class="avatar-large" id="my-avatar" style="margin: 0 auto;">U</div>
        <input type="text" id="edit-name-input" class="neu-input" placeholder="Name">
        <input type="text" id="edit-bio-input" class="neu-input" placeholder="Bio">
        <button id="save-profile-btn" class="neu-btn primary">Save Changes</button>
        <button id="close-profile-btn" class="neu-btn">Close</button>
      </div>
    </div>

    <!-- Notifications Modal -->
    <div id="notif-modal" class="modal-overlay hidden">
      <div class="modal-card neumorphic-card">
        <h3>Notifications & Invites</h3>
        <div id="notif-list" style="display:flex; flex-direction:column; gap:10px;"></div>
        <button id="close-notif-btn" class="neu-btn">Close</button>
      </div>
    </div>

    <!-- 3-Line Main Menu -->
    <div id="main-menu-modal" class="modal-overlay hidden">
      <div class="modal-card neumorphic-card">
        <div class="menu-item" id="menu-my-profile">👤 Explore & Edit My Profile</div>
        <div class="menu-item" id="menu-invites">📩 Chat Invites</div>
        <!-- Logout with New Icon -->
        <div class="menu-item danger-text" id="menu-logout">
          <svg class="svg-icon sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Logout
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
