<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tock - Premium Neumorphic Chat</title>
  <link rel="stylesheet" href="style.css">
  <!-- Firebase Core & Auth/Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="dark-theme">

  <!-- STEP 1: AUTH SCREEN WITH FIREBASE PHONE OTP -->
  <div id="auth-screen" class="auth-container">
    <div class="neumorphic-card auth-card">
      <div class="auth-header">
        <h1 class="logo">Tock</h1>
        <button class="icon-btn-svg" id="auth-theme-btn" title="Toggle Theme">☀️</button>
      </div>
      <p class="subtitle">Enter +880 phone number to receive OTP</p>
      
      <!-- Step 1: Send OTP -->
      <div id="phone-step" class="input-group">
        <input type="text" id="auth-name" placeholder="Your Full Name" class="neu-input">
        <input type="tel" id="auth-phone" placeholder="+8801XXXXXXXXX" class="neu-input">
        <div id="recaptcha-container"></div>
        <button id="send-otp-btn" class="neu-btn primary">Send OTP</button>
      </div>

      <!-- Step 2: Verify OTP (Hidden by default) -->
      <div id="otp-step" class="input-group hidden">
        <input type="text" id="auth-otp" placeholder="Enter 6-digit OTP" class="neu-input">
        <button id="verify-otp-btn" class="neu-btn primary">Verify & Login</button>
      </div>
    </div>
  </div>

  <!-- STEP 2: MAIN APP CONTAINER -->
  <div id="app-container" class="app-container hidden">
    <!-- Header -->
    <header class="top-header">
      <h1 class="logo">Tock</h1>
      <div class="header-right">
        <button class="icon-btn-svg rel" id="notif-btn" title="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span class="badge" id="notif-badge"></span>
        </button>
        <button class="icon-btn-svg" id="theme-btn" title="Toggle Theme">☀️</button>
        <button class="icon-btn-svg" id="main-menu-btn" title="Menu">☰</button>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="tabs-container">
      <button class="tab-btn active" id="tab-chats">Chats</button>
      <button class="tab-btn" id="tab-contacts">Contacts</button>
    </div>

    <!-- Search Bar -->
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search number or name...">
      <button class="3d-search-btn-svg" id="search-btn">🔍</button>
    </div>

    <!-- Main List Panel -->
    <div id="list-panel" class="list-panel"></div>

    <!-- Active Chat Window -->
    <div id="chat-screen" class="chat-screen hidden">
      <div class="chat-header">
        <button class="icon-btn-svg" id="chat-back-btn">⬅</button>
        <div class="partner-info-btn" id="partner-header-info">
          <div class="avatar-small" id="chat-partner-avatar">U</div>
          <div>
            <div class="partner-name" id="chat-partner-name">User</div>
            <div class="partner-status" id="chat-partner-status">Offline</div>
          </div>
        </div>
        <button class="icon-btn-svg" id="chat-info-btn">ℹ️</button>
      </div>

      <div id="pinned-banner" class="pinned-banner hidden">
        <span>📌 Pinned: <span id="pinned-msg-text">...</span></span>
      </div>

      <div id="messages-container" class="messages-container"></div>

      <!-- Floating Bar for Reply / Edit / 3Dot -->
      <div id="floating-action-bar" class="floating-action-bar hidden">
        <button id="act-reply" class="act-btn">↩️ Reply</button>
        <button id="act-edit" class="act-btn">✏️ Edit</button>
        <button id="act-delete" class="act-btn">🗑️ Delete</button>
      </div>

      <div class="input-container">
        <div id="reply-preview-box" class="reply-preview-box hidden">
          <span id="reply-preview-text">Replying...</span>
          <button id="cancel-reply-btn" class="close-sm">✖</button>
        </div>
        <div class="input-wrapper">
          <textarea id="message-input" placeholder="Type a message..." rows="1"></textarea>
          <button id="send-btn" class="send-btn">Send</button>
        </div>
      </div>
    </div>

    <!-- Profile Edit Modal -->
    <div id="edit-profile-modal" class="modal-overlay hidden">
      <div class="modal-card neumorphic-card">
        <h3>Edit Profile</h3>
        <input type="text" id="edit-name-input" class="neu-input" placeholder="Name">
        <input type="text" id="edit-bio-input" class="neu-input" placeholder="Bio">
        <button id="save-profile-btn" class="neu-btn primary">Save Changes</button>
        <button id="close-profile-btn" class="neu-btn">Close</button>
      </div>
    </div>

    <!-- Notifications Modal -->
    <div id="notif-modal" class="modal-overlay hidden">
      <div class="modal-card neumorphic-card">
        <h3>Notifications & Invites</h3>
        <div id="notif-list" style="display:flex; flex-direction:column; gap:10px;"></div>
        <button id="close-notif-btn" class="neu-btn">Close</button>
      </div>
    </div>

    <!-- Main Dropdown Modal -->
    <div id="main-menu-modal" class="modal-overlay hidden">
      <div class="modal-card neumorphic-card">
        <div class="menu-item" id="menu-my-profile">👤 View / Edit My Profile</div>
        <div class="menu-item" id="menu-invites">📩 Chat Invites</div>
        <div class="menu-item" id="menu-logout">Logout</div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
