<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tock Chat</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="dark-theme">

  <!-- Authentication Screen -->
  <div id="auth-screen" class="auth-wrapper">
    <div class="auth-card neu-card">
      <button class="theme-btn-trigger neu-btn icon-only-btn" title="Toggle Theme">
        <span class="theme-icon">🌙</span>
      </button>

      <div class="auth-header">
        <h2>Welcome to Tock</h2>
        <p>Enter your details to continue</p>
      </div>

      <!-- Step 1: Phone & Name Input -->
      <div id="phone-step" class="auth-step">
        <div class="input-group">
          <input type="text" id="auth-name" class="neu-input" placeholder="Your Name" required />
        </div>
        <div class="input-group">
          <input type="tel" id="auth-phone" class="neu-input" placeholder="Phone (e.g. 01700000000)" required />
        </div>
        <div id="recaptcha-container"></div>
        <button id="send-otp-btn" class="neu-btn primary full-width">Send OTP</button>
      </div>

      <!-- Step 2: OTP Input -->
      <div id="otp-step" class="auth-step hidden">
        <div class="input-group">
          <input type="number" id="auth-otp" class="neu-input" placeholder="Enter 6-digit OTP" required />
        </div>
        <button id="verify-otp-btn" class="neu-btn primary full-width">Verify & Login</button>
      </div>
    </div>
  </div>

  <!-- Main App Container -->
  <div id="app-container" class="app-layout hidden">
    <!-- Main Top Bar -->
    <header class="top-bar neu-card">
      <button id="main-menu-btn" class="neu-btn icon-only-btn">☰</button>
      <h1 class="brand-title">Tock</h1>
      <div class="top-actions">
        <button class="theme-btn-trigger neu-btn icon-only-btn">🌙</button>
        <button class="notif-btn-trigger neu-btn icon-only-btn relative">
          🔔 <span class="notif-badge-elem"></span>
        </button>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button id="tab-chats" class="tab-btn active">Chats</button>
      <button id="tab-contacts" class="tab-btn">Contacts</button>
    </div>

    <!-- Contacts / Chats List Panel -->
    <main id="list-panel" class="content-panel"></main>

    <!-- Active Chat Screen Overlay -->
    <div id="chat-screen" class="chat-overlay hidden">
      <header class="chat-header neu-card">
        <button id="chat-back-btn" class="neu-btn icon-only-btn">←</button>
        <div id="chat-info-btn" class="chat-user-details">
          <div id="chat-partner-avatar" class="avatar-small">U</div>
          <div>
            <div id="chat-partner-name" class="partner-name">User</div>
            <div id="chat-partner-status" class="partner-status">Offline</div>
          </div>
        </div>
      </header>

      <!-- Neumorphic Typing Indicator Bar -->
      <div id="typing-indicator" class="typing-box hidden neu-card">
        <span>typing</span>
        <div class="typing-dots">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>

      <!-- Pinned Message Banner -->
      <div id="pinned-banner" class="pinned-banner hidden neu-card">
        <div class="pinned-text">📌 <span id="pinned-msg-text">Pinned Message</span></div>
        <button id="unpin-btn" class="neu-btn sm">Unpin</button>
      </div>

      <!-- Messages Stream -->
      <div id="messages-container" class="messages-container"></div>

      <!-- Floating Neumorphic Action Bar for Selected Message -->
      <div id="floating-action-bar" class="floating-action-bar hidden neu-card">
        <button id="act-reply" class="neu-btn sm" title="Reply">↩ Reply</button>
        <button id="act-edit" class="neu-btn sm" title="Edit">✏️ Edit</button>
        <button id="act-pin" class="neu-btn sm" title="Pin">📌 Pin</button>
        <button id="act-delete" class="neu-btn sm danger" title="Delete">🗑️ Delete</button>
      </div>

      <!-- Reply Preview Bar -->
      <div id="reply-preview-box" class="reply-preview hidden neu-card">
        <span id="reply-preview-text">Replying...</span>
        <button id="cancel-reply-btn" class="neu-btn sm">✕</button>
      </div>

      <!-- Message Input Bar -->
      <div class="chat-input-bar neu-card">
        <input type="text" id="message-input" class="neu-input" placeholder="Type a message..." />
        <button id="send-btn" class="neu-btn primary">Send</button>
      </div>
    </div>
  </div>

  <!-- Notifications Modal -->
  <div id="notif-modal" class="modal-overlay hidden">
    <div class="modal-card neu-card">
      <h3>Notifications</h3>
      <div id="notif-list" class="modal-body"></div>
      <button id="close-notif-btn" class="neu-btn full-width" style="margin-top: 15px;">Close</button>
    </div>
  </div>

  <!-- User Details / Partner Info Modal -->
  <div id="info-modal" class="modal-overlay hidden">
    <div class="modal-card neu-card text-center">
      <div id="info-avatar" class="avatar-large" style="margin:0 auto 10px auto;">U</div>
      <h3 id="info-name">User Name</h3>
      <p id="info-phone" style="color:var(--text-muted); margin-bottom: 20px;">Phone</p>
      <button id="info-close-modal" class="neu-btn full-width">Close</button>
    </div>
  </div>

  <!-- Main Menu Modal -->
  <div id="main-menu-modal" class="modal-overlay hidden">
    <div class="modal-card neu-card">
      <h3>Menu</h3>
      <div class="menu-list">
        <button id="menu-my-profile" class="neu-btn full-width" style="margin-bottom: 10px;">My Profile</button>
        <button id="menu-logout" class="neu-btn full-width danger">Logout</button>
      </div>
    </div>
  </div>

  <!-- Edit Profile Modal -->
  <div id="edit-profile-modal" class="modal-overlay hidden">
    <div class="modal-card neu-card">
      <h3>My Profile</h3>
      <div class="avatar-large" id="my-avatar" style="margin: 0 auto 15px auto;">U</div>
      <div class="input-group">
        <input type="text" id="edit-name-input" class="neu-input" placeholder="Name" />
      </div>
      <div class="input-group">
        <input type="text" id="edit-bio-input" class="neu-input" placeholder="Bio" />
      </div>
      <button id="save-profile-btn" class="neu-btn primary full-width" style="margin-bottom: 10px;">Save Profile</button>
      <button id="close-profile-btn" class="neu-btn full-width">Cancel</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
