<!DOCTYPE html>
<html lang="eng">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tock - Neumorphic Messenger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- AUTHENTICATION VIEW -->
  <div id="authView" class="auth-wrapper">
    <div class="auth-card neu-card">
      <button class="neu-btn icon-only-btn theme-btn-trigger" id="authThemeToggle" title="Toggle Theme">
        🌙
      </button>
      
      <div class="auth-header">
        <h2>Tock</h2>
        <p id="authSubtitle">আপনার অ্যাকাউন্টে লগইন করুন</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm">
        <div class="input-group">
          <input type="email" id="loginEmail" class="neu-input" placeholder="ইমেইল এড্রেস" required>
        </div>
        <div class="input-group">
          <input type="password" id="loginPassword" class="neu-input" placeholder="পাসওয়ার্ড" required>
        </div>
        <button type="submit" class="neu-btn primary full-width">লগইন করুন</button>
        <p style="margin-top: 15px; font-size: 13px;" class="text-center">
          একাউন্ট নেই? <a href="#" id="switchToRegister" style="color: var(--primary-color);">রেজিস্টার করুন</a>
        </p>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="hidden">
        <div class="input-group">
          <input type="text" id="regName" class="neu-input" placeholder="আপনার নাম" required>
        </div>
        <div class="input-group">
          <input type="email" id="regEmail" class="neu-input" placeholder="ইমেইল এড্রেস" required>
        </div>
        <div class="input-group">
          <input type="password" id="regPassword" class="neu-input" placeholder="পাসওয়ার্ড" required>
        </div>
        <button type="submit" class="neu-btn primary full-width">একাউন্ট তৈরি করুন</button>
        <p style="margin-top: 15px; font-size: 13px;" class="text-center">
          ইতিমধ্যে একাউন্ট আছে? <a href="#" id="switchToLogin" style="color: var(--primary-color);">লগইন করুন</a>
        </p>
      </form>
    </div>
  </div>

  <!-- MAIN APP VIEW -->
  <div id="appView" class="app-layout hidden">
    
    <!-- Top Bar -->
    <header class="top-bar neu-card">
      <div class="brand-title">Tock</div>
      <div class="top-actions">
        <button class="neu-btn icon-only-btn relative" id="notifBtn" title="নোটিফিকেশন">
          🔔
          <span class="notif-badge-elem" id="notifBadge"></span>
        </button>
        <button class="neu-btn icon-only-btn" id="appThemeToggle" title="থিম পরিবর্তন">
          🌙
        </button>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs">
      <button class="tab-btn active" id="tabChats">চ্যাটস</button>
      <button class="tab-btn" id="tabRequests">রিকোয়েস্ট</button>
      <button class="tab-btn" id="tabProfile">প্রোফাইল</button>
    </nav>

    <!-- Content Panels -->
    <main class="content-panel">
      
      <!-- CHATS PANEL -->
      <section id="panelChats">
        <div class="search-box-wrap">
          <input type="text" id="searchChatsInput" class="neu-input" placeholder="ইউজার বা চ্যাট খুঁজুন...">
        </div>
        <div id="chatsList">
          <!-- Chat list items will be injected here dynamically -->
        </div>
      </section>

      <!-- REQUESTS PANEL -->
      <section id="panelRequests" class="hidden">
        <div class="search-box-wrap">
          <input type="email" id="requestEmailInput" class="neu-input" placeholder="ইমেইল দিয়ে ইউজার খুঁজুন...">
          <button class="neu-btn primary" id="sendReqBtn">পাঠান</button>
        </div>
        <h3>ফ্রেন্ড রিকোয়েস্টসমূহ</h3>
        <div id="requestsList" style="margin-top: 10px;">
          <!-- Request list items will be injected dynamically -->
        </div>
      </section>

      <!-- PROFILE PANEL -->
      <section id="panelProfile" class="hidden">
        <div class="neu-card" style="padding: 20px; text-align: center;">
          <div class="avatar-large" id="profileAvatar" style="margin: 0 auto 15px auto;">U</div>
          <h2 id="profileName">User Name</h2>
          <p id="profileEmail" style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">user@example.com</p>
          
          <button class="neu-btn danger full-width" id="logoutBtn">লগআউট করুন</button>
        </div>
      </section>

    </main>

    <!-- CHAT SCREEN OVERLAY -->
    <div id="chatScreen" class="chat-overlay hidden">
      <div class="chat-header neu-card">
        <button class="neu-btn icon-only-btn" id="closeChatBtn">⬅</button>
        <div class="chat-user-details" id="chatHeaderUser">
          <div class="avatar-small" id="chatPartnerAvatar">U</div>
          <div>
            <div class="partner-name" id="chatPartnerName">User</div>
            <div class="partner-status" id="chatPartnerStatus">Online</div>
          </div>
        </div>
      </div>

      <!-- Pinned Message Banner -->
      <div id="pinnedBanner" class="pinned-banner neu-card hidden">
        <span id="pinnedText">পিন করা মেসেজ...</span>
        <button class="neu-btn sm" id="unpinBtn">আনপিন</button>
      </div>

      <!-- Messages Area -->
      <div class="messages-container" id="messagesContainer">
        <!-- Message bubbles dynamically populated here -->
      </div>

      <!-- Typing Indicator inside chat -->
      <div id="typingIndicator" class="typing-box neu-card hidden">
        <span id="typingUserName">কেউ একজন</span> টাইপ করছেন...
        <div class="typing-dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>

      <!-- Reply Preview Bar -->
      <div id="replyPreviewBar" class="reply-preview neu-card hidden">
        <div>
          <small style="color: var(--primary-color);">রিপ্লাই দিচ্ছেন:</small>
          <p id="replyPreviewText" style="font-size: 13px; color: var(--text-muted);"></p>
        </div>
        <button class="neu-btn sm danger" id="cancelReplyBtn">✕</button>
      </div>

      <!-- Input Bar -->
      <div class="chat-input-bar">
        <input type="text" id="msgInput" class="neu-input" placeholder="মেসেজ লিখুন...">
        <button class="neu-btn primary icon-only-btn" id="sendMsgBtn">➔</button>
      </div>
    </div>

  </div>

  <!-- FLOATING ACTION BAR FOR MESSAGES (CONTEXT MENU) -->
  <div id="floatingActionBar" class="floating-action-bar neu-card hidden">
    <button class="neu-btn sm" id="actionReply">রিপ্লাই</button>
    <button class="neu-btn sm" id="actionCopy">কপি</button>
    <button class="neu-btn sm" id="actionPin">পিন</button>
    <button class="neu-btn sm danger" id="actionDelete">ডিলিট</button>
  </div>

  <!-- NOTIFICATION MODAL -->
  <div id="notifModal" class="modal-overlay hidden">
    <div class="modal-card neu-card">
      <h3>নোটিফিকেশনসমূহ</h3>
      <div id="notifList" style="max-height: 250px; overflow-y: auto; margin-bottom: 15px;">
        <!-- Notification list -->
      </div>
      <button class="neu-btn full-width" id="closeNotifModalBtn">বন্ধ করুন</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
